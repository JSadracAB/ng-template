<mat-drawer-container class="drawer-container">
  <mat-drawer
    #drawer
    fixedInViewport
    [opened]="isDesktop()"
    [mode]="isDesktop() ? 'side' : 'over'"
  >
    <app-toolbar>
      <span>Drawer content</span>
    </app-toolbar>
  </mat-drawer>
  <mat-drawer-content>
    <ng-content></ng-content>
  </mat-drawer-content>
</mat-drawer-container>
